name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    name: Rust / ${{ matrix.command }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        command: [check, test, clippy]
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: rustdb_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      RUSTDB_TEST_DATABASE_URL: postgresql://postgres@localhost:5432/rustdb_test
      CARGO_BUILD_JOBS: "2"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        if: matrix.command == 'check'
        run: cargo fmt --all -- --check
      - name: Check
        if: matrix.command == 'check'
        run: cargo check --locked --workspace
      - name: Test
        if: matrix.command == 'test'
        run: cargo test --locked --workspace -- --include-ignored
      - name: Clippy
        if: matrix.command == 'clippy'
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  container:
    name: Container build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build runtime image (no push)
        run: docker build --tag orisema-data:ci --file Dockerfile .
      - name: Verify packaged server and frontend assets
        run: |
          docker run --rm --entrypoint /bin/sh orisema-data:ci -c 'test -x /usr/local/bin/orisema-data-server && test -f /app/frontend/dist/index.html'
