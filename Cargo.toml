[workspace]
members = ["crates/orisema-data-core", "crates/orisema-data-server"]
resolver = "2"

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "AGPL-3.0-only"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-rustls-ring", "postgres", "uuid", "chrono", "json"] }
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "2"
